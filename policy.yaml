# Ad compliance policy for the Lumière Velvet Matte Lipstick campaign.
# Thresholds are starting points, to be tuned against reviewer labels.

version: 1

campaign:
  brand: Lumière
  product: Velvet Matte Lipstick
  brief: >
    Creator tutorials and product demos showing Lumière Velvet Matte Lipstick
    being applied and worn.
  relevance_queries:
    - "applying lipstick to lips"
    - "close-up of a lipstick bullet"

relevance:
  on_brief_min: 70   # Pegasus score >= 70 -> ON_BRIEF
  weak_min: 40       # 40-69 -> WEAK (REVIEW); below 40 -> OFF_BRIEF (BLOCK)
  # If Pegasus says ON_BRIEF but Marengo finds less than this many seconds of
  # product footage (or vice versa), route to REVIEW as a model disagreement.
  marengo_min_product_seconds: 3

thresholds:
  block_confidence: 0.7
  corroboration_tolerance_sec: 2

categories:
  hate_harassment:
    definition: Slurs, demeaning remarks about identity or appearance, bullying or body-shaming.
    default_severity: high
    # The category itself is now tested (13_hate_harassment.mp4, caught correctly at high
    # severity), but still can't be corroborated visually: that clip's violation is a purely
    # spoken body-shaming remark over normal-looking footage (we deliberately avoided slurs or
    # explicit language), so this query still ranks an unrelated clip first. Harmless to
    # scoring - corroborate.py skips visual corroboration for speech findings - but a
    # visually-depicted example would be needed to validate or tune this query.
    marengo_queries: ["person mocking someone's appearance"]
  drugs_illegal:
    definition: Drug use, drug paraphernalia, underage drinking, or other illegal acts.
    default_severity: high
    marengo_queries: ["person smoking", "pills on a table"]
  profanity:
    definition: >
      Swearing or sexually explicit language. Rate severity low for mild swearing (e.g.
      "damn"), medium for strong swearing (e.g. the f-word), and high only for sexually
      explicit language - the f-word alone is strong, not explicit.
    default_severity: low
    tolerance:
      mild_max_count: 2   # more mild instances -> REVIEW; strong -> REVIEW; explicit -> BLOCK
  unsafe_usage:
    definition: >
      Unsafe or misleading product application, e.g. liner on the inner waterline,
      lip product used on the eyes, applying on broken skin, shared applicators.
    default_severity: medium
    # Untested against a true positive: the test set's only unsafe_usage example
    # (09_unsafe_application.mp4) is a purely spoken violation over normal-looking footage,
    # so no visual query (several rephrasings tried) can corroborate it. Harmless to scoring -
    # corroborate.py skips visual corroboration for speech/on-screen-text findings - but these
    # queries need a visually-unsafe example clip before they can be validated or trusted.
    marengo_queries:
      - "applying eyeliner to the inner waterline"
      - "makeup applied near the eyeball"
  medical_claims:
    definition: >
      Health or medical claims, e.g. cures or treats a condition, permanent results,
      unsupported "clinically proven" or dermatologist claims.
    default_severity: medium
    marengo_queries: []
